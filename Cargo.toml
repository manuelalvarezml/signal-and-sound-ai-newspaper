[package]
name = "signal-and-sound"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "A two-page AI and music AI newspaper, built in Rust with Typst"

[dependencies]
anyhow = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }

aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process"] }
aws-sigv4 = "1"
aws-credential-types = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
feed-rs = "2"
futures = "0.3"
lambda_runtime = "0.14"
lopdf = { version = "0.36", default-features = false }
minijinja = { version = "2", features = ["loader", "json", "builtins"] }
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
robotstxt = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
walkdir = "2"

[profile.release]
strip = true
lto = false
codegen-units = 16
