[project]
name = "signal-and-sound"
version = "0.1.0"
description = "A finite, evidence-led AI newspaper for screen and paper"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2", "httpx>=0.28,<1", "feedparser>=6,<7", "trafilatura>=2,<3", "pydantic>=2.10,<3", "jinja2>=3.1,<4", "reportlab>=4,<5", "pypdf>=5,<7", "PyYAML>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
