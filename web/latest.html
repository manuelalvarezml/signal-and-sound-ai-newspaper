<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal & Sound</title><link rel="stylesheet" href="{{ asset_base }}/style.css"></head><body><main class="archive-wrap"><a class="brand" href="/">Signal <span>&</span> Sound.</a><div id="status" class="empty">Opening the {{ kind }} edition…</div><a href="/archive.html">Browse the archive ↗</a><noscript><p>JavaScript is only needed to find the newest edition. All archived newspaper pages work without it.</p></noscript></main><script>fetch('/latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const issue=data[{{ kind|tojson }}];if(issue)location.replace(issue.pages[{{ section|tojson }}]);else document.getElementById('status').textContent='The first weekly digest arrives Monday, October 26, covering our opening Wednesday–Sunday. Daily editions are already in the archive.'}).catch(()=>document.getElementById('status').textContent='The latest-edition index is temporarily unavailable. You can still open an archived edition.');</script></body></html>
